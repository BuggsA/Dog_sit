<svg xmlns="http://www.w3.org/2000/svg">
<!--
  Walks for Lucy: custom icon set (original artwork).
  48×48 grid, 2.4 stroke, round caps. Colors follow the text color (currentColor).
  Use: <svg class="i"><use href="/img/icons.svg#paw"/></svg>
-->
<defs><style>
  .s{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .f{fill:currentColor;stroke:none}
</style></defs>

<symbol id="logo" viewBox="0 0 64 64">
  <!-- Lucy herself: scruffy white terrier, gray ears & eye patch, maroon harness, heart tag -->
  <g stroke="#2f4a3f" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
    <!-- floppy gray ears -->
    <path d="M21 16 C16 9.5 9 8.5 4.5 12 C3.5 13 4 14.2 5 15 L7 16.2 L6 18.5 L9 19.5 L9 22.5 L12.5 22.5 C14 25 16 26.5 17.5 26 C18.5 22 19.5 19 21 16 Z" fill="#8f979d" transform="rotate(-28 20 17)"/>
    <path d="M43 16 C48 9.5 55 8.5 59.5 12 C60.5 13 60 14.2 59 15 L57 16.2 L58 18.5 L55 19.5 L55 22.5 L51.5 22.5 C50 25 48 26.5 46.5 26 C45.5 22 44.5 19 43 16 Z" fill="#8f979d" transform="rotate(28 44 17)"/>
    <!-- scruffy head with wiry beard -->
    <path d="M18.5 19 C20 12 25 9 32 9 C39 9 44 12 45.5 19 C47.5 23 48.5 27 48.5 31 L51 33 L48.2 34.5 L50.5 38 L47.2 38.6 C46.2 42.5 44 46 41 49 L42 52.5 L38.5 51 L37 55 L34.5 52 L32 56 L29.5 52 L27 55 L25.5 51 L22 52.5 L23 49 C20 46 17.8 42.5 16.8 38.6 L13.5 38 L15.8 34.5 L13 33 L15.5 31 C15.5 27 16.5 23 18.5 19 Z" fill="#ffffff"/>
    <!-- top tufts -->
    <path d="M23.5 12.5 L22 6.5 L26.5 10 L28.5 4.5 L31.5 9 L34.5 4 L36.5 9.5 L41 6 L40.5 12" fill="#ffffff"/>
  </g>
  <!-- gray patch over left eye -->
  <path d="M19.5 22 C21 19 27 18.5 30 21 C31 24 30 29 27 31 C23.5 32 20 30.5 19 27.5 Z" fill="#b7bdc1"/>
  <!-- wiry eyebrows -->
  <g stroke="#6d757b" stroke-width="1.4" stroke-linecap="round" fill="none">
    <path d="M21.5 22.5 L24.5 21 M24.5 21.5 L27 20.5 M27 21.5 L29.5 21.5"/>
    <path d="M42.5 22.5 L39.5 21 M39.5 21.5 L37 20.5 M37 21.5 L34.5 21.5"/>
  </g>
  <!-- eyes -->
  <circle cx="25.5" cy="26.5" r="3.1" fill="#3a2418"/>
  <circle cx="38.5" cy="26.5" r="3.1" fill="#3a2418"/>
  <circle cx="26.6" cy="25.4" r="1" fill="#fff"/>
  <circle cx="39.6" cy="25.4" r="1" fill="#fff"/>
  <!-- nose -->
  <path d="M27.4 34.2 C27.4 31.8 36.6 31.8 36.6 34.2 C36.6 37.4 34.1 39.2 32 39.2 C29.9 39.2 27.4 37.4 27.4 34.2 Z" fill="#1d1d1f"/>
  <ellipse cx="30.4" cy="33.4" rx="1.3" ry="0.7" fill="#5a5a5e"/>
  <!-- open smile + tongue -->
  <path d="M29.6 42.2 C29.6 47.6 34.4 47.6 34.4 42.2 Z" fill="#e8848f" stroke="#2f4a3f" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M32 39.2 L32 41.2 M26 40.5 C28 43 30 42.6 32 41.2 C34 42.6 36 43 38 40.5" fill="none" stroke="#2f4a3f" stroke-width="1.5" stroke-linecap="round"/>
  <!-- beard whisker strokes -->
  <g stroke="#c5cacd" stroke-width="1" stroke-linecap="round">
    <path d="M22 41 L19.5 43 M23 44 L21 46.5 M42 41 L44.5 43 M41 44 L43 46.5"/>
  </g>
  <!-- maroon harness + heart tag -->
  <path d="M21.5 53 C27 57.5 37 57.5 42.5 53" fill="none" stroke="#7a2e3a" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M32 63 C28.4 60.6 27 59 27 57.3 C27 56 28 55 29.3 55 C30.3 55 31.3 55.6 32 56.6 C32.7 55.6 33.7 55 34.7 55 C36 55 37 56 37 57.3 C37 59 35.6 60.6 32 63 Z" fill="#c2704f" stroke="#2f4a3f" stroke-width="1.2" stroke-linejoin="round"/>
</symbol>


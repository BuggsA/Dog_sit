<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2f4a3f">
  <title>Dashboard · Walks for Lucy</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..600,0..100,0..1;1,9..144,400..600,0..100,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/admin.js"></script>
</head>
<body>
  <header class="site-header">
    <nav class="container nav">
      <a class="brand" href="/admin/"><svg class="mark" aria-hidden="true"><use href="/img/icons.svg#logo"/></svg><span><span class="word">Walks <em>for</em> Lucy</span><span class="tag">Dashboard</span></span></a>
      <a href="/" class="btn outline sm">View site</a>
    </nav>
  </header>
  <main class="container" style="padding:36px 0 80px">
    <h1 style="font-size:2.2rem">Hi Anissa</h1>
    <div class="admin-bar" style="margin:20px 0 8px">
      <div class="tabs" id="tabs">
        <button data-tab="pending" class="active"><svg class="i"><use href="/img/icons.svg#mail"/></svg>Requests <span class="count" id="pending-count" hidden></span></button>
        <button data-tab="approved"><svg class="i"><use href="/img/icons.svg#check"/></svg>Upcoming</button>
        <button data-tab="declined"><svg class="i"><use href="/img/icons.svg#close"/></svg>Declined</button>
        <button data-tab="calendar"><svg class="i"><use href="/img/icons.svg#calendar"/></svg>Calendar</button>
        <button data-tab="clients"><svg class="i"><use href="/img/icons.svg#user"/></svg>Clients</button>
      </div>
    </div>

    <section id="list-view" style="padding:20px 0">
      <div class="grid" id="req-list"></div>
    </section>

    <section id="clients-view" hidden style="padding:20px 0">
      <div id="clients-list-wrap">
        <div class="field" style="max-width:420px"><label for="client-search">Find a client</label>
          <input id="client-search" type="search" placeholder="Name, email, phone or pet" autocomplete="off"></div>
        <div class="grid client-grid" id="clients-list"></div>
      </div>
      <div id="client-detail" hidden></div>
    </section>

    <dialog id="report-dialog" class="sheet" aria-labelledby="report-title">
      <form id="report-form" novalidate>
        <div class="admin-bar">
          <h2 id="report-title" style="margin:0;font-size:1.5rem">Visit report</h2>
          <button type="button" class="pet-remove" data-close aria-label="Close"><svg class="i"><use href="/img/icons.svg#close"/></svg></button>
        </div>
        <p class="muted small" id="report-for" style="margin:4px 0 16px"></p>
        <div class="row">
          <div class="field"><label for="r-date">Date</label><input id="r-date" type="date" required></div>
          <div class="field"><label for="r-time">Time (optional)</label><input id="r-time" placeholder="e.g. 8:15 AM" maxlength="20"></div>
        </div>
        <div class="field"><span class="label">What we did</span><div class="choices" id="r-done"></div></div>
        <div class="field"><label for="r-notes">Notes</label><textarea id="r-notes" rows="4" maxlength="4000" placeholder="How the visit went: walk route, appetite, mood, anything to tell the family…"></textarea></div>
        <div class="field"><span class="label">Photos</span>
          <div class="photo-picks" id="r-previews"></div>
          <label class="add-pet" for="r-photos" style="margin-top:10px"><svg class="i"><use href="/img/icons.svg#camera"/></svg><span>Add photos</span></label>
          <input id="r-photos" type="file" accept="image/*" multiple hidden>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:8px">
          <button class="btn" type="submit">Post report</button>
          <span class="muted" id="r-msg" aria-live="polite"></span>
        </div>
      </form>
    </dialog>

    <section id="cal-view" hidden style="padding:20px 0">
      <div class="card">
        <div class="admin-bar" style="margin-bottom:16px">
          <button class="btn outline sm" id="prev" aria-label="Previous month">‹</button>
          <h2 id="cal-title" style="margin:0;font-size:1.6rem"></h2>
          <button class="btn outline sm" id="next" aria-label="Next month">›</button>
        </div>
        <p class="muted small">Tap a day to block or unblock it. Striped days show as unavailable on the booking page. A dot means an approved booking.</p>
        <div class="cal" id="cal"></div>
        <div id="day-detail" style="margin-top:20px"></div>
      </div>
    </section>
  </main>
</body>
</html>

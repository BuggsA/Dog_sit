# Cloudflare Pages config for walksforlucy.com
name = "dog-sit"
pages_build_output_dir = "public"
compatibility_date = "2025-09-01"

# ── Database (needed for booking requests + admin) ─────────────────────
# 1) Run:  npx wrangler d1 create walks-for-lucy
# 2) Uncomment the 4 lines below and paste the database_id it prints.
#    (Or skip this file and add a D1 binding named "DB" in the dashboard:
#     Pages project → Settings → Bindings → Add → D1 database.)
# [[d1_databases]]
# binding = "DB"
# database_name = "walks-for-lucy"
# database_id = "paste-id-here"

# Admin login + notifications are set in the dashboard:
# Pages project → Settings → Variables and secrets (see README).

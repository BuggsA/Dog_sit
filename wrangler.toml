# Walks for Lucy (walksforlucy.com): Cloudflare Worker + static assets
name = "dog-sit"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Keep variables you set in the Cloudflare dashboard when deploying
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
# Run the Worker code first for these paths (API, Anissa's admin page, clients' account page)
run_worker_first = ["/api/*", "/admin", "/admin/*", "/account", "/account/*"]

# ── Database (needed for booking requests + admin) ─────────────────────
# 1) Create it: Cloudflare dashboard → Storage & databases → D1 → Create,
#    name it "walks-for-lucy" (or run: npx wrangler d1 create walks-for-lucy)
# 2) Its Database ID goes below (already connected).
[[d1_databases]]
binding = "DB"
database_name = "walks-for-lucy"
database_id = "efec6a94-df87-4d81-ac9a-0abca66ae56b"
